services:
  - type: web
    name: agrosentinel-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://agrosentinel-backend-4f8q.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Service worker e index siempre se revalidan para que las versiones nuevas lleguen.
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
