services:
  - type: web
    name: agrosentinel-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://agrosentinel-backend-4f8q.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
